{% extends "layout.html" %}

{% block content %}
<div class="container-fluid page-container">
  <p class="hero-message">{{ mensaje }}</p>
  <p class="section-title">Estos son los productos que ofrecemos:</p>
  <ul class="custom-list">
    <li class="custom-list-item">Producto 1</li>
    <li class="custom-list-item">Producto 2</li>
    <li class="custom-list-item">Producto 3</li>
  </ul>
</div>
<div id="carouselExampleControls"
class="carousel slide mi-carrusel"
data-ride="carousel">

<div class="carousel-inner">

<div class="carousel-item active">
<img src="{{ url_for('static', filename='img/productos/pepsi.jpeg') }}"
class="d-block w-100"
alt="Pepsi">
</div>

<div class="carousel-item">
<img src="{{ url_for('static', filename='img/productos/simi.jpeg') }}"
class="d-block w-100"
alt="simi">
</div>

<div class="carousel-item">
<img src="{{ url_for('static', filename='img/productos/tatto.jpeg') }}"
class="d-block w-100"
alt="tatto">
</div>

</div>

<a class="carousel-control-prev"
href="#carouselExampleControls"
role="button"
data-slide="prev">

<span class="carousel-control-prev-icon"
aria-hidden="true"></span>
</a>

<a class="carousel-control-next"
href="#carouselExampleControls"
role="button"
data-slide="next">

<span class="carousel-control-next-icon"
aria-hidden="true"></span>
</a>

</div>

</div>
{% endblock %}

<!Doctype html>
<html lang="es">
    <head>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{ titulo }}</title>
    </head>
    
    <body class="site-body">
    <div class="container-fluid site-wrapper">
        <nav class="navbar navbar-expand-lg navbar-light custom-navbar">
            <a class="navbar-brand custom-brand" href="#">Navbar</a>
            <button class="navbar-toggler custom-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto custom-nav-list">
                    <li class="nav-item active custom-nav-item">
                        <a class="nav-link custom-nav-link" href="#">Home <span class="sr-only">(current)</span></a>
                    </li>
                    <li class="nav-item custom-nav-item">
                        <a class="nav-link custom-nav-link" href="{{ url_for('servicios') }}">servicios</a>
                    </li>
                    <li class="nav-item custom-nav-item">
                        <a class="nav-link custom-nav-link" href="{{ url_for('productos') }}">productos</a>
                    </li>
                    <li class="nav-item custom-nav-item">
                        <a class="nav-link custom-nav-link" href="{{ url_for('contacto') }}">contacto</a>
                    </li>
                </ul>
            </div>
        </nav>
        {% block content %}
        {% endblock %}
    </div>
    </body>
</html>
